name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Copy and Rename APK for Release
      run: |
        mkdir -p release_output
        cp app/build/outputs/apk/debug/*.apk release_output/CarTwin-v1.4.1.apk
        cp app/build/outputs/apk/debug/*.apk release_output/CarTwin-v1.4.apk
        cp app/build/outputs/apk/debug/*.apk release_output/cartwin.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarTwin-v1.4.1-apk
        path: release_output/CarTwin-v1.4.1.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.4.1
        name: "CarTwin v1.4.1 (Avtomatik Simsiz OTA Yenilənmə Mühərriki & Port 7000 Server)"
        body: |
          ## 🌟 CarTwin — Premium Connect (Release v1.4.1)

          Bu buraxılış bütün müştəri avtomobilləri üçün **Simsiz Avtomatik Yenilənmə (OTA - Over-The-Air Auto-Update Engine)** mühərrikini təqdim edir!

          ### 🚀 Bu Yenilənmənin Əhəmiyyəti:
          * **Birdəfəlik Quraşdırma**: Artıq avtomobillərə bir dəfə quraşdırdıqdan sonra hər dəfə USB fleşkart və ya əl ilə yükləməyə **qətiyyən ehtiyac yoxdur**.
          * **Avtomatik Yoxlama**: Avtomobil işə düşəndə və Wi-Fi/LTE şəbəkəsinə qoşulan kimi CarTwin arxa planda yeni versiyaları avtomatik yoxlayır.
          * **1 Kliklə Yenilənmə**: Yeni yenilənmə çıxan kimi ekranda **"🚀 vX.X Yenilə"** bildirişi və dəyişiklik siyahısı açılır, 1 kliklə yüklənib dərhal yenilənir.
        files: |
          release_output/CarTwin-v1.4.1.apk
          release_output/CarTwin-v1.4.apk
          release_output/cartwin.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
