name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build CarTwin Mobile Debug APK
      run: |
        chmod +x gradlew
        ./gradlew :mobile:assembleDebug --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Get Version from Gradle
      id: get_version
      run: |
        VERSION_NAME=$(grep 'versionName =' mobile/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=v$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "raw_version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Detected version: v$VERSION_NAME"

    - name: Copy and Rename APK for Release
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p release_output
        APK_PATH=$(find mobile/build/outputs/apk/debug -name "*.apk" | head -n 1)
        echo "Found APK at: $APK_PATH"
        cp "$APK_PATH" "release_output/CarTwin-${VERSION}.apk"
        cp "$APK_PATH" release_output/CarTwin-v2.2.1.apk
        cp "$APK_PATH" release_output/CarTwin-v2.2.0.apk
        cp "$APK_PATH" release_output/cartwin.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cartwin-v2.2.1-apk
        path: release_output/cartwin.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: "CarTwin ${{ steps.get_version.outputs.version }} (All Chinese Automotive Brands Universal Integration)"
        body: |
          ## CarTwin 2.2.1 — Bütün Çin Avtomobilləri üçün Universal Apple CarPlay & Data Kabel Arxitekturası

          Bütün Çin avtomobil brendləri (BYD, Changan, Geely, Zeekr, Chery, Haval/Tank, Li Auto, NIO, XPeng, GAC, Voyah, Hongqi, BAIC, MG, Xiaomi Auto, Leapmotor) üçün tam avtomatik brend tanıma və adaptiv interfeysə malik Doğma Apple CarPlay Sistemi!

          ### Əsas Yeniliklər və Texniki İnteqrasiya:
          * **Universal Avtomobil Detektoru**: Tətbiq avtomobilə yüklənən kimi aparat göstəricilərini (MANUFACTURER, BRAND, MODEL, sistem servislərini və ekran nisbətini) təhlil edərək avtomobilin dəqiq brendini (BYD DiLink, Changan Sunflower 21:9, Geely Flyme Auto, Chery Lion OS, Haval Tank, Li Auto 3K və s.) 100% avtomatik təyin edir və interfeysi ona uyğunlaşdırır.
          * **Birbaşa Data Kabel İnteqrasiyası**: Xüsusi CarPlay data kabeli taxılan kimi Apple Vendor Switch 0x52 siqnalı göndərilir, iPhone dərhal CarPlay aksesuar rejiminə keçir və re-enumeration tamamlanır.
          * **USBMUX & Doğma iAP2 Protokol Mühərriki**: USB multiplexor kanalı (EP 4 / EP 0x85) üzərindən iAP2 əlaqə sessiyası qurulur, identification və avtomobil ekran konfiqurasiyası Apple standartına uyğun ötürülür.
          * **Yerli Oflayn MFi Autentifikasiyası**: offline-mfi sertifikat zənciri (certificate.p7b və identity.pk8) tətbiqə daxili inteqrasiya edilib, iPhone-dan gələn kriptoqrafik çağırışları yerli olaraq doğrulayır.
          * **CDC-NCM Ethernet & Virtual IPv6 Tuneli**: Root icazəsi tələb olunmadan VpnService vasitəsilə USB kabel üzərindən fe80:: IPv6 link-local şəbəkəsi və NTB-16 paket axını təmin olunur.
          * **Aşağı Gecikməli H.264 Video & Daxili Səs Axını**: iPhone-un daxili AirPlay/CarPlay video axını birbaşa MediaCodec dekoderinə yönləndirilir və avtomobil monitorunda tam ekran şəkildə açılır.
          * **Tam Toxunma və Sükan İdarəetməsi**: Avtomobil ekranındakı toxunmalar HID protokoluna çevrilərək dərhal iPhone-a ötürülür.
        files: |
          release_output/CarTwin-${{ steps.get_version.outputs.version }}.apk
          release_output/CarTwin-v2.2.1.apk
          release_output/cartwin.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
