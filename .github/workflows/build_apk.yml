name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build CarTwin Mobile Debug APK
      run: |
        chmod +x gradlew
        ./gradlew :mobile:assembleDebug --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Get Version from Gradle
      id: get_version
      run: |
        VERSION_NAME=$(grep 'versionName =' mobile/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=v$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "raw_version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Detected version: v$VERSION_NAME"

    - name: Copy and Rename APK for Release
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p release_output
        APK_PATH=$(find mobile/build/outputs/apk/debug -name "*.apk" | head -n 1)
        echo "Found APK at: $APK_PATH"
        cp "$APK_PATH" "release_output/CarTwin-${VERSION}.apk"
        cp "$APK_PATH" release_output/CarTwin-v2.2.0.apk
        cp "$APK_PATH" release_output/CarTwin-v2.0.apk
        cp "$APK_PATH" release_output/cartwin.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cartwin-v2.2.0-apk
        path: release_output/cartwin.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: "CarTwin ${{ steps.get_version.outputs.version }} (Native BYD DiLink CarPlay Integration)"
        body: |
          ## CarTwin 2.2.0 — BYD Native Apple CarPlay & Data Cable Architecture

          Avtomobil monitorlari (BYD DiLink ve butun Android sistemleri) ucun tam inteqrasiya edilmis Dogma Apple CarPlay Sistemi!

          ### Esas Yenilikler ve Texniki Inteqrasiya:
          * **Birbasa Data Kabel Inteqrasiyasi**: Xususi CarPlay data kabeli taxilan kimi Apple Vendor Switch 0x52 siqnali gonderilir, iPhone derhal CarPlay aksesuar rejimine kecir ve re-enumeration tamamlanir.
          * **USBMUX & Dogma iAP2 Protokol Muherriki**: USB multiplexor kanali (EP 4 / EP 0x85) uzerinden iAP2 elaqe sessiyasi qurulur, identification ve avtomobil ekran konfiqurasiyasi Apple standartina uygun oturulur.
          * **Yerli Oflayn MFi Autentifikasiyasi**: offline-mfi sertifikat zenciri (certificate.p7b ve identity.pk8) tetbiqe daxili inteqrasiya edilib, iPhone-dan gelen kriptoqrafik cagirislari yerli olaraq dogrulayir.
          * **CDC-NCM Ethernet & Virtual IPv6 Tuneli**: Root icazesi teleb olunmadan VpnService vasitesile USB kabel uzerinden fe80:: IPv6 link-local sebekesi ve NTB-16 paket axini temin olunur.
          * **Asagi Gecikmeli H.264 Video & Daxili Ses Axini**: iPhone-un daxili AirPlay/CarPlay video axini birbasa MediaCodec dekoderine yonlendirilir ve avtomobil monitorunda tam ekran sekilde acilir.
          * **Tam Toxunma ve Sukan Idareetmesi**: Avtomobil ekranindaki toxunmalar HID protokoluna cevrilerek derhal iPhone-a oturulur.
        files: |
          release_output/CarTwin-${{ steps.get_version.outputs.version }}.apk
          release_output/CarTwin-v2.2.0.apk
          release_output/cartwin.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
