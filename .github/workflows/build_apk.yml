name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        gradle assembleDebug -x lint --no-daemon --stacktrace

    - name: Copy and Rename APK for Release
      run: |
        mkdir -p release_output
        cp app/build/outputs/apk/debug/*.apk release_output/UniversalCarPlay-v1.0.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UniversalCarPlay-v1.0-apk
        path: release_output/UniversalCarPlay-v1.0.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Universal CarPlay v1.0.0 (Hazır APK)"
        body: |
          ## 🚗 Universal Apple CarPlay Android Receiver
          
          Bu buraxılış **BYD, Changan, Li Auto və bütün Android monitorlar** üçün hazırlanmışdır.
          
          ### 📥 Necə Yükləmək və Quraşdırmaq olar:
          1. Aşağıdakı **`UniversalCarPlay-v1.0.apk`** faylını yükləyin.
          2. USB fleşkarta köçürüb avtomobilin USB portuna taxın.
          3. Monitorun "File Manager" tətbiqi ilə açıb quraşdırın.
          
          ### ✨ Əsas Funksiyalar:
          * Simsiz (Bluetooth/Wi-Fi) və Simli (USB) CarPlay dəstəyi
          * Avtomobil modelini avtomatik tanıma (BYD, Changan, Li Auto)
          * Azərbaycan, Türk, Rus və İngilis dillərində AI Səs Köməkçisi
          * Split-Screen Lüks Dashboard və Kondisioner Zolağı
          * YouTube Park Rejimi (Video Unlock)
        files: release_output/UniversalCarPlay-v1.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
