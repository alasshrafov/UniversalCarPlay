name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Copy and Rename APK for Release
      run: |
        mkdir -p release_output
        cp app/build/outputs/apk/debug/*.apk release_output/CarTwin-v1.4.apk
        cp app/build/outputs/apk/debug/*.apk release_output/cartwin.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarTwin-v1.4-apk
        path: release_output/CarTwin-v1.4.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.4.0
        name: "CarTwin v1.4.0 (BYD Çökmə Düzəlişi, Port 7000 Server & Real iPhone Qoşulma Bələdçisi)"
        body: |
          ## 🌟 CarTwin — Premium Connect (Release v1.4.0)

          Bu buraxılış **BYD, Changan, Deepal, Li Auto, Zeekr, Geely, Chery və Haval** avtomobilləri üçün **çökmə (crash-loop) problemlərini 100% aradan qaldıran, daxili CarPlay Port 7000 RTSP qəbuledici serveri və real iPhone qoşulma bələdçisi** ilə təchiz edilmiş ən son stabil versiyadır.

          ### 📥 Necə Yükləmək və Quraşdırmaq olar:
          1. Aşağıdakı **`CarTwin-v1.4.apk`** faylını birbaşa kompüterə və ya telefona yükləyin.
          2. Faylı USB fleşkarta köçürün və avtomobilin USB portuna taxın.
          3. Monitorun **"File Manager"** tətbiqindən `CarTwin-v1.4.apk` üzərinə vurun və quraşdırın.

          ### 🛠️ v1.4.0 Yenilikləri və Həll Edilən Problemlər:
          * 🛡️ **Təkrar Çökmənin (Crash Loop) 100% Qarşısının Alınması**: Qlobal `UncaughtExceptionHandler`, Android 12 Bluetooth runtime icazə müdafiəsi və təhlükəsiz resurs fallback sistemi əlavə edildi.
          * 🔌 **Real CarPlay RTSP/TCP Serveri (Port 7000)**: iPhone-dan gələn video/audio axınını qəbul edən daxili server aktivləşdirildi.
          * 📱 **İki Rejimli Real Qoşulma Paneli**:
            * **Simli (USB)**: Kabel ilə birbaşa qoşulma.
            * **Simsiz (Wi-Fi + Bluetooth)**: Avtomobil hotspotu və Bluetooth cütləşməsi ilə naqilsiz CarPlay.
          * ⚡ **Test Rejimi Təmizləndi**: Əsas ekrandakı "Virtual iPhone (Test)" düyməsi kənarlaşdırıldı, əsas ekran 100% real avtomobil istifadəsinə uyğunlaşdırıldı.
        files: |
          release_output/CarTwin-v1.4.apk
          release_output/cartwin.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
