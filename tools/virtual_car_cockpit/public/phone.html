<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarTwin — iPhone Simsiz Ötürücü</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-blue: #007aff;
            --apple-green: #34c759;
            --apple-dark: #1c1c1e;
            --apple-gray: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            justify-content: space-between;
        }

        .header-card {
            text-align: center;
            padding: 20px 0;
        }

        .apple-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.4;
        }

        /* Status Banner */
        .status-box {
            background: var(--apple-dark);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 15px 0;
        }

        .status-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(0, 122, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--apple-blue);
        }

        .status-icon.connected {
            background: rgba(52, 199, 89, 0.15);
            color: var(--apple-green);
        }

        .status-text h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .status-text p {
            font-size: 12px;
            color: #8e8e93;
        }

        /* Action Buttons */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 15px 0;
        }

        .btn-stream {
            background: var(--apple-blue);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.4);
            transition: all 0.2s;
        }

        .btn-stream:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-stream.active {
            background: var(--apple-green);
            box-shadow: 0 10px 25px rgba(52, 199, 89, 0.4);
        }

        .btn-camera {
            background: var(--apple-gray);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        /* Car Cockpit Controls */
        .remote-card {
            background: var(--apple-dark);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 10px;
        }

        .remote-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #8e8e93;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .remote-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .remote-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .remote-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Hidden Video and Canvas elements for processing */
        #localVideo {
            width: 100%;
            height: 180px;
            border-radius: 14px;
            object-fit: cover;
            display: none;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #636366;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div>
        <div class="header-card">
            <div class="apple-badge">
                <span>🍏</span> Apple CarPlay Transmitter
            </div>
            <h1>Simsiz Avtomobil Əlaqəsi</h1>
            <p class="subtitle">Bu telefonun ekranını real vaxtda kompüterinizdəki virtual BYD monitoruna ötürün.</p>
        </div>

        <div class="status-box">
            <div class="status-icon" id="statusIcon">📡</div>
            <div class="status-text">
                <h4 id="statusTitle">Monitor Hazırdır</h4>
                <p id="statusDesc">Aşağıdakı düymə ilə yayımı başladın</p>
            </div>
        </div>

        <video id="localVideo" autoplay playsinline muted></video>

        <div class="action-group">
            <button class="btn-stream" id="btnScreen" onclick="startScreenShare()">
                <span>📱</span>
                <span id="btnScreenText">Ekranımı Yansıt (Screen Share)</span>
            </button>

            <button class="btn-camera" id="btnCamera" onclick="startCameraShare()">
                <span>📷</span>
                <span>Kamera ilə Test Et</span>
            </button>
        </div>

        <!-- Cockpit Remote Control -->
        <div class="remote-card">
            <div class="remote-title">
                <span>Avtomobil Monitoru İdarəsi</span>
                <span style="color: #34c759;">Aktiv</span>
            </div>
            <div class="remote-grid">
                <button class="remote-btn" onclick="sendRemoteCmd('rotate')">🔄 Monitoru Fırlat</button>
                <button class="remote-btn" onclick="sendRemoteCmd('siri')">🎙️ Siri / Aura AI</button>
                <button class="remote-btn" onclick="sendRemoteCmd('vol_up')">🔊 Səs +</button>
                <button class="remote-btn" onclick="sendRemoteCmd('vol_down')">🔉 Səs -</button>
            </div>
        </div>
    </div>

    <footer>
        CarTwin v2.2.0 • Ultra Low Latency Stream
    </footer>

    <canvas id="captureCanvas" style="display: none;"></canvas>

    <script>
        let currentStream = null;
        let phonePeer = null;
        let frameInterval = null;

        const video = document.getElementById('localVideo');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d');

        // 1. Ekran Yayımını Başlatmaq (getDisplayMedia)
        async function startScreenShare() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
                    currentStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { frameRate: 60 },
                        audio: true
                    });
                } else {
                    // Fallback to camera if iOS restrictions prevent getDisplayMedia in normal HTTP
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' }
                    });
                }
                handleStreamStarted('Ekran');
            } catch (err) {
                console.warn('Ekran icazəsi alınmadı, kameraya keçilir:', err);
                startCameraShare();
            }
        }

        // 2. Kamera Yayımını Başlatmaq (getUserMedia)
        async function startCameraShare() {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                handleStreamStarted('Kamera');
            } catch (err) {
                alert('Xəta: Kamera/Ekran icazəsi verilmədi: ' + err.message);
            }
        }

        function handleStreamStarted(type) {
            video.srcObject = currentStream;
            video.style.display = 'block';

            document.getElementById('statusIcon').classList.add('connected');
            document.getElementById('statusIcon').innerText = '🟢';
            document.getElementById('statusTitle').innerText = 'Yayim Aktivdir!';
            document.getElementById('statusDesc').innerText = `${type} axını monitora canlı ötürülür`;

            document.getElementById('btnScreen').classList.add('active');
            document.getElementById('btnScreenText').innerText = 'Yayımı Dayandır';
            document.getElementById('btnScreen').onclick = stopStream;

            // Kadrları arxa fonda serverə itələyirik (Dual pipeline: WebRTC + Canvas fallback)
            startPushingFrames();
            startPhoneWebRtc(currentStream);
        }

        function stopStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            if (frameInterval) clearInterval(frameInterval);
            video.style.display = 'none';

            document.getElementById('statusIcon').classList.remove('connected');
            document.getElementById('statusIcon').innerText = '📡';
            document.getElementById('statusTitle').innerText = 'Monitor Hazırdır';
            document.getElementById('statusDesc').innerText = 'Aşağıdakı düymə ilə yayımı başladın';

            document.getElementById('btnScreen').classList.remove('active');
            document.getElementById('btnScreenText').innerText = 'Ekranımı Yansıt (Screen Share)';
            document.getElementById('btnScreen').onclick = startScreenShare;

            fetch('/api/reset');
        }

        // Kadr göndərmə (Yüksək keyfiyyətli JPEG axını)
        function startPushingFrames() {
            if (frameInterval) clearInterval(frameInterval);
            frameInterval = setInterval(() => {
                if (!video.videoWidth) return;
                canvas.width = Math.min(video.videoWidth, 800);
                canvas.height = (canvas.width / video.videoWidth) * video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const base64 = canvas.toDataURL('image/jpeg', 0.65);

                fetch('/api/frame/push', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        frame: base64,
                        model: navigator.userAgent.includes('iPhone') ? 'Apple iPhone' : 'Mobil Cihaz'
                    })
                }).catch(() => {});
            }, 50); // ~20 fps kadr tezliyi
        }

        // WebRTC P2P Bağlantısı
        async function startPhoneWebRtc(stream) {
            phonePeer = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            stream.getTracks().forEach(track => phonePeer.addTrack(track, stream));

            phonePeer.onicecandidate = (e) => {
                if (e.candidate) {
                    fetch('/api/signal/candidate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ from: 'phone', candidate: e.candidate })
                    });
                }
            };

            const offer = await phonePeer.createOffer();
            await phonePeer.setLocalDescription(offer);

            await fetch('/api/signal/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sdp: offer.sdp })
            });

            // Answer gözlənilir
            const answerPoll = setInterval(async () => {
                try {
                    const res = await fetch('/api/signal/answer');
                    const data = await res.json();
                    if (data.sdp && phonePeer.signalingState !== 'stable') {
                        clearInterval(answerPoll);
                        await phonePeer.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
                        console.log('🎉 WebRTC P2P CarPlay kanalı yaradıldı!');
                    }
                } catch (e) {}
            }, 800);
        }

        // Avtomobil pult komandaları
        function sendRemoteCmd(cmd) {
            if (navigator.vibrate) navigator.vibrate(30);
            if (cmd === 'siri') {
                alert('🎙️ Siri / Aura AI aktivləşdirildi!');
            }
        }
    </script>
</body>
</html>
