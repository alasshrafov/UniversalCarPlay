name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Copy and Rename APK for Release
      run: |
        mkdir -p release_output
        cp app/build/outputs/apk/debug/*.apk release_output/CarTwin-v1.3.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarTwin-v1.3-apk
        path: release_output/CarTwin-v1.3.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.3.0
        name: "CarTwin v1.3.0 (Orijinal Avtomobil Loqoları & 3D Xrom Reklam Şousu)"
        body: |
          ## 🌟 CarTwin — Premium Connect (Release v1.3.0)

          Bu buraxılış **BYD, Changan, Deepal, Li Auto, Zeekr, Geely, Chery və Haval** avtomobilləri üçün **rəsmi 3D metalik xrom loqo açılış şouları, iOS 17/18 Retina tətbiq ikonları və CarPlay Split Dashboard** ilə təchiz edilmiş ən son stabil versiyadır.

          ### 📥 Necə Yükləmək və Quraşdırmaq olar:
          1. Aşağıdakı **`CarTwin-v1.3.apk`** faylını birbaşa kompüterə və ya telefona yükləyin.
          2. Faylı USB fleşkarta köçürün və avtomobilin USB portuna taxın.
          3. Monitorun **"File Manager"** tətbiqindən `CarTwin-v1.3.apk` üzərinə vurun və quraşdırın.

          ### ✨ Yeni Funksiyalar (v1.3.0):
          * 🚘 **Orijinal Avtomobil Loqoları (3D Xrom & Fotorealistik):** BYD, Changan, Li Auto, Zeekr, Geely, Chery və Haval rəsmi vektor emblemləri ilə lazer parıltılı açılış şousu.
          * 🧭 **iOS 17/18 Retina CarPlay İkonları:** Apple Maps, Spotify, Musiqi, Brauzer, Telefon, Mesajlar və Siri üçün kristal təmiz vektor qrafikaları.
          * 🎛️ **CarPlay Split Dashboard (Avtomobil Rejimi):** Sol tərəfdə canlı naviqasiya xəritəsi və dönmə göstəricisi, sağ tərəfdə isə canlı Spotify pleyeri və ağıllı əmr kartı.
          * 🌐 **İnteqrasiya Olunmuş Veb Brauzer:** Google, YouTube, Vikipediya bir toxunuşla multimedia ekranında.
          * 🗣️ **Azərbaycan Dilli AI Səs Köməkçisi:** *"Brauzeri aç"*, *"YouTube-u başlat"*, kondisioner və naviqasiya.
        files: release_output/CarTwin-v1.3.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
