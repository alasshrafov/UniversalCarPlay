name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Get Version from Gradle
      id: get_version
      run: |
        VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=v$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "raw_version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Detected version: v$VERSION_NAME"

    - name: Copy and Rename APK for Release
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p release_output
        cp app/build/outputs/apk/debug/*.apk "release_output/CarTwin-${VERSION}.apk"
        cp app/build/outputs/apk/debug/*.apk release_output/CarTwin-v1.4.apk
        cp app/build/outputs/apk/debug/*.apk release_output/cartwin.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarTwin-v1.4.6-apk
        path: release_output/CarTwin-v1.4.6.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: "CarTwin ${{ steps.get_version.outputs.version }} (Avtomatik USB Filter, Qırılmaz Stream Akkumulyatoru & Ani IDR Kadr Dəstəyi)"
        body: |
          ## 🌟 CarTwin — Premium Connect (${{ steps.get_version.outputs.version }})

          Bu buraxılışda **USB Qoşulma və Görüntü Sabitliyi** 100% mükəmməlləşdirildi:

          ### 🚀 Əsas Yeniliklər:
          * **Avtomatik USB Filter (`device_filter.xml`)**: Adapter taxılan kimi Android sistemi icazəni avtomatik təsdiqləyir və tətbiqi dərhal aktivləşdirir.
          * **Qırılmaz Stream Akkumulyatoru (Ring Buffer)**: Bütün USB paket parçalanmaları və desinxronizasiyası aradan qaldırıldı; video axını tam kəsintisiz və sabit işləyir.
          * **Ani IDR Kadr və Video Fokus (Commands 12 & 500)**: iPhone kabelə taxılan kimi ilk saniyədən I-frame və video fokus tələb olunur, qara ekran gözləməsi aradan qaldırıldı.
          * **İkili Bonjour mDNS**: Həm `_airplay._tcp`, həm də `_carplay._tcp` aktivdir.
        files: |
          release_output/CarTwin-${{ steps.get_version.outputs.version }}.apk
          release_output/CarTwin-v1.4.apk
          release_output/cartwin.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
