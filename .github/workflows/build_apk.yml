name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Get Version from Gradle
      id: get_version
      run: |
        VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=v$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "raw_version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Detected version: v$VERSION_NAME"

    - name: Copy and Rename APK for Release
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p release_output
        cp app/build/outputs/apk/debug/*.apk "release_output/CarTwin-${VERSION}.apk"
        cp app/build/outputs/apk/debug/*.apk release_output/CarTwin-v2.0.apk
        cp app/build/outputs/apk/debug/*.apk release_output/cartwin.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cartwin-v2.0.0-apk
        path: release_output/cartwin.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: "CarTwin ${{ steps.get_version.outputs.version }} (Böyük İnqilab: Apple CarPlay & Android Auto İkili Platforması, AOA 2.0 & Aura AI)"
        body: |
          ## 🌟 CarTwin 2.0 — Dual-Platform Revolution (${{ steps.get_version.outputs.version }})

          Avtomobil monitorları üçün inqilabi yenilənmə: **Apple CarPlay və Android Auto eyni anda vahid tətbiqdə!**

          ### 🚀 Əsas Yeniliklər:
          * **İkili Universal Platforma (CarPlay + Android Auto)**: Carlinkit / AutoKit dongle və AOA 2.0 protokolu ilə həm iPhone, həm də bütün Android cihazları (Samsung, Xiaomi, Pixel, Huawei və s.) dərhal qoşulur.
          * **Avtomatik Cihaz Təyini**: Telefon kabelə və ya adapterə qoşulan kimi model aşkarlanır və müvafiq interfeys (Apple CarPlay və ya Android Auto) avtomatik işə salınır.
          * **Azərbaycan Dilli Aura AI Səs Köməkçisi**: Android Auto mühitində Siri olmadığı üçün sükan mikrofonu birbaşa Aura AI-ya qoşulur — sükan düyməsi ilə kondisioner, pəncərələr, naviqasiya və musiqi Azərbaycan dilində idarə olunur.
          * **Qırılmaz Stream Akkumulyatoru & Ani IDR Kadr**: USB paket parçalanmaları tam aradan qaldırıldı, qara ekran gecikməsi olmadan ilk saniyədən sabit H.264 video axını təmin edildi.
          * **Default Bluetooth Adı ("CarTwin")**: Avtomobil Bluetooth və BLE yayım adı təmiz "CarTwin" olaraq təyin edildi; adapter menyusundan (192.168.50.2) dongle adı da rahatlıqla dəyişdirilə bilir.
          * **Avtomobil İnteqrasiyaları**: BYD, Changan, Geely, Chery, Zeekr, Li Auto və Haval üçün iqlim HUD, sükan düymələri və toxunma idarəetməsi hər iki platformada eyni dərəcədə qüsursuz işləyir.
        files: |
          release_output/CarTwin-${{ steps.get_version.outputs.version }}.apk
          release_output/CarTwin-v2.0.apk
          release_output/cartwin.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
