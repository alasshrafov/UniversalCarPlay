name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Copy and Rename APK for Release
      run: |
        mkdir -p release_output
        cp app/build/outputs/apk/debug/*.apk release_output/UniversalCarPlay-v1.0.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UniversalCarPlay-v1.0-apk
        path: release_output/UniversalCarPlay-v1.0.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Universal CarPlay v1.0.0 (Hazır APK)"
        body: |
          ## 🚗 Universal Apple CarPlay Android Receiver v1.0.0

          Bu buraxılış **BYD (DiLink), Changan (Deepal/Avatr), Li Auto (L7/L8/L9), Zeekr və bütün Android monitorlar** üçün tam hazır APK faylıdır.

          ### 📥 Necə Yükləmək və Quraşdırmaq olar:
          1. Aşağıdakı **`UniversalCarPlay-v1.0.apk`** faylını birbaşa kompüterə və ya telefona yükləyin.
          2. Faylı USB fleşkarta (flash drive) köçürün və avtomobilin USB portuna taxın.
          3. Monitorun daxili **"File Manager" (Fayl Meneceri)** tətbiqini açıb `UniversalCarPlay-v1.0.apk` üzərinə vurun və quraşdırın.

          ### ✨ Əsas Funksiyalar:
          * 🎬 **Reklam Çarxı Stilində Açılış Şousu:** BYD, Changan, Li Auto və Zeekr orijinal vektor loqoları ilə dinamik animasiya.
          * 🚗 **Avtomobil Modelini 100% Avtomatik Tanıma:** Heç bir əl konfiqurasiyası tələb olunmur.
          * 📶 **Simsiz və Simli CarPlay:** Bluetooth LE + Wi-Fi Hotspot və USB Plug-and-Play dəstəyi.
          * 🗣️ **Çoxdilli AI Səs Köməkçisi:** Azərbaycan dili (`az-AZ`), Türk, Rus və İngilis dillərində kondisioner, naviqasiya və zəng idarəetməsi.
          * 🎛️ **Lüks Split-Screen Dashboard:** Sürətölçən (km/h), batareya faizi, ikili iqlim nəzarəti və YouTube Park Rejimi.
        files: release_output/UniversalCarPlay-v1.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
