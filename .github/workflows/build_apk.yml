name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug -x lint --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log

    - name: Get Version from Gradle
      id: get_version
      run: |
        VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=v$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "raw_version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Detected version: v$VERSION_NAME"

    - name: Copy and Rename APK for Release
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        mkdir -p release_output
        cp app/build/outputs/apk/debug/*.apk "release_output/CarTwin-${VERSION}.apk"
        cp app/build/outputs/apk/debug/*.apk release_output/CarTwin-v1.4.apk
        cp app/build/outputs/apk/debug/*.apk release_output/cartwin.apk
        ls -la release_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarTwin-v1.4.6-apk
        path: release_output/CarTwin-v1.4.6.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: "CarTwin ${{ steps.get_version.outputs.version }} (Aura AI LLM Səs Mühərriki & Dərin Semantik NLU)"
        body: |
          ## 🌟 CarTwin — Premium Connect (${{ steps.get_version.outputs.version }})

          Bu buraxılışda **Aura AI Səs Köməkçisi** tamamilə yeniləndi və LLM-səviyyəli dərin semantik Azərbaycan dili NLU (Natural Language Understanding) mühərriki ilə təchiz edildi!

          ### 🚀 Əsas Yeniliklər:
          * **Sərbəst Söz Sırası**: "artır səsi", "səsi artır", "bir az ucalt səsi", "azaldarsan səsi" və s. hər cür sərbəst cümləni mükəmməl anlayır.
          * **Sürücü Hissiyyatı**: "Üşüdüm", "Donuruq", "Peçi yandır" dedikdə salonu qızdırır; "İstidir", "Yandım", "Nəfəs almaq olmur" dedikdə soyudur.
          * **Waze & Naviqasiya**: "Yolu itirdim", "Haradayam", "Yola düşək" dedikdə Waze açır; "Waze bağla" və ya "Xəritədən çıx" dedikdə tətbiqi bağlayır.
          * **Dinq-dinq Səsi**: Sürücünü narahat edən siqnal səsi tam ləğv edildi.
          * **Simsiz OTA Yenilənmə**: Avtomobil internetə qoşulan kimi avtomatik aşkarlanır və 1 toxunuşla quraşdırılır.
        files: |
          release_output/CarTwin-${{ steps.get_version.outputs.version }}.apk
          release_output/CarTwin-v1.4.apk
          release_output/cartwin.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
